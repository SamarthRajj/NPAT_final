<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPAT — Lobby</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/lobby.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Lobby</h1>
      <p class="tagline">Room <span class="room-code" id="roomId"></span></p>
    </header>

    <section class="card">
      <h2 style="margin:0 0 1rem;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)">Players</h2>
      <ul id="players" class="player-list"></ul>
      <button type="button" id="startBtn" class="btn btn-primary hidden">Start game</button>
    </section>
  </main>
</body>
</html>
